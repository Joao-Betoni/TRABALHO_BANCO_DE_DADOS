<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Central do Brasil - Avaliar filme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar bg-body-tertiary mb-4">
        <div class="container">
            <a href="catalogo.html" class="navbar-brand fw-bold">CINE CENTRAL DO BRASIL</a>
            <a href="catalogo.html" class="btn btn-outline-secondary btn-sm">Voltar ao catálogo</a>
        </div>
    </nav>

    <main class="container" style="max-width: 46rem;">
        <div id="alerta" class="alert alert-danger py-2 d-none" role="alert"></div>

        <h1 id="titulo-filme" class="h3 mb-1">Carregando...</h1>
        <p id="desc-avaliacao" class="text-body-secondary mb-4"></p>

        <div id="questionario"></div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="anonima">
            <label class="form-check-label" for="anonima">
                Publicar minha avaliação como <strong>anônima</strong> (seu nome não aparece no perfil nem nos relatórios)
            </label>
        </div>

        <div class="d-grid gap-2 mb-5">
            <button id="btn-enviar" class="btn btn-primary">Enviar avaliação</button>
        </div>
    </main>

    <script type="module" src="js/filme.js"></script>
</body>
</html>
