<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Central do Brasil - Cadastrar filme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar bg-body-tertiary mb-4">
        <div class="container">
            <a href="catalogo.html" class="navbar-brand fw-bold">CINE CENTRAL DO BRASIL</a>
            <a href="catalogo.html" class="btn btn-outline-secondary btn-sm">Catálogo</a>
        </div>
    </nav>

    <main class="container" style="max-width: 40rem;">
        <h1 class="h4 mb-1">Cadastrar filme</h1>
        <p class="text-body-secondary mb-4">
            O questionário de avaliação (7 questões por tema) é montado automaticamente
            e enviado a todos os usuários.
        </p>

        <div id="alerta" class="alert alert-danger py-2 d-none" role="alert"></div>

        <form id="form-filme">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" required>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <label for="ano" class="form-label">Ano</label>
                    <input type="number" class="form-control" id="ano" min="1895" max="2100" required>
                </div>
                <div class="col">
                    <label for="generoId" class="form-label">Gênero</label>
                    <select class="form-select" id="generoId" required></select>
                </div>
                <div class="col">
                    <label for="duracaoMin" class="form-label">Duração (min)</label>
                    <input type="number" class="form-control" id="duracaoMin" min="1">
                </div>
            </div>
            <div class="mb-3">
                <label for="sinopse" class="form-label">Sinopse</label>
                <textarea class="form-control" id="sinopse" rows="3"></textarea>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Cadastrar filme</button>
            </div>
        </form>
    </main>

    <script type="module" src="js/cadastre-filme.js"></script>
</body>
</html>
