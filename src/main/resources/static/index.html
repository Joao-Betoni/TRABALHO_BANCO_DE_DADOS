<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Central do Brasil - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center">
    <main class="card shadow" style="width: 24rem;">
        <div class="card-body p-4">
            <h1 class="h3 text-center mb-1">CINE CENTRAL DO BRASIL</h1>
            <p class="text-center text-body-secondary mb-4">Avalie o cinema nacional</p>

            <div id="alerta" class="alert alert-danger py-2 d-none" role="alert"></div>

            <form id="form-login">
                <div class="mb-3">
                    <label for="email" class="form-label">Endereço de email</label>
                    <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Acessar</button>
                    <a class="btn btn-link" href="cadastre-se.html">Cadastre-se</a>
                </div>
            </form>
        </div>
    </main>

    <script type="module" src="js/login.js"></script>
</body>
</html>
